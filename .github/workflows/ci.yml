name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:
jobs:
  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
      - name: npm install, build
        run: |
          npm install
          npm run build
      - name: Check build output
        run: |
          ls -la out/
          echo "Build completed successfully"
      - name: Start static server
        run: |
          npx serve out -p 37495 &
          sleep 5
      - name: Run Lighthouse CI
        id: lighthouse
        run: |
          npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Stop static server
        if: always()
        run: |
          pkill -f "serve out" || true
      - name: Format lighthouse score
        id: format
        uses: actions/github-script@v7
        with:
          script: |
            const lighthouseCommentMaker = require('./.github/workflows/lighthouseCommentMaker.js');
            // Read the lighthouse results from the .lighthouseci directory
            const fs = require('fs');
            const path = require('path');

            try {
              const manifestPath = path.join('.lighthouseci', 'manifest.json');
              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));

              // Create a mock lighthouseOutputs object
              const lighthouseOutputs = {
                links: {
                  'http://localhost:3000': 'https://storage.googleapis.com/lighthouse-infrastructure.appspot.com/reports/...'
                },
                manifest: manifest
              };

              const comment = lighthouseCommentMaker({ lighthouseOutputs });
              core.setOutput('comment', comment);
            } catch (error) {
              core.setOutput('comment', '## ⚡️🏠 Lighthouse report\n\nLighthouse CI completed successfully. Check the workflow logs for detailed results.');
            }
      - name: Add Lighthouse stats as comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lighthouse
          message: ${{ steps.format.outputs.comment }}